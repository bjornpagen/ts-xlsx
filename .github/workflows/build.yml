name: Build

# The publishable-artifact gate. corpus.yml proves the source is correct; this
# proves the *emitted* package is shippable: it compiles to ESM .js + .d.ts, loads
# and round-trips as a consumer would import it, and stays under the size budget.
#
# Node 24 for the toolchain (type-stripping dev workflow + tsc emit). The emitted
# artifact itself targets ES2022; the supported floor is Node >=24, per package.json engines.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    name: Publishable build + size budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Emit ESM .js + .d.ts to dist/.
      - run: pnpm run build
      # Type-check the emitted .d.ts the way a consumer's editor would: through the
      # package name, so the `exports` map resolves and every subpath's declarations
      # are pulled in. The corpus proves the emitted JS behaves; nothing else in the
      # pipeline reads the declarations, which are inference-produced (ADR 0031).
      - run: pnpm run typecheck:dist
      # Load the compiled artifact as a consumer would and verify a write→read round-trip.
      - run: pnpm run smoke:dist
      # Run the FULL behavioral corpus against the emitted artifact, not just the
      # smoke round-trip: proves every case that passes on stripped src/ also passes
      # on the tsc-emitted JS consumers actually run. Reuses the single build above.
      - run: pnpm run corpus:dist
      # Fail if the emitted runtime JS crosses the bundle-size budget.
      - run: pnpm run size

name: Corpus

# The regression corpus is the knowledge harvested across the rewrite, and the
# rewrite (src/) is the reference implementation validated against it. Everything
# here must stay green on every push and PR.
#
# Node 24: the rewrite runs its .ts sources directly via type-stripping (no build
# step) — see docs/decisions/0001-rewrite-runtime-and-toolchain.md. pnpm is the
# package manager; `--frozen-lockfile` fails the run if pnpm-lock.yaml is stale.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '**' ]

jobs:
  corpus:
    name: Rewrite gates + regression corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The whole gate set, from its single definition in scripts/verify.ts — lint,
      # both typecheck configs, unit tests, the regression corpus, docs:check and
      # constitution:check, run concurrently. This step deliberately does NOT list
      # them: an enumeration here would be a second definition of "everything" that
      # nothing keeps in step with verify --full (ADR 0022). A failing gate still
      # names itself in the Checks UI — verify emits a GitHub annotation per gate.
      #
      # `node …` rather than `pnpm run test` skips the package-manager wrapper.
      - run: node scripts/verify.ts --full

  coverage:
    name: Coverage floors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Its own job, not a step in the one above. The floors are a real gate and were enforced by
    # nothing: a change dropping branch coverage from 95% to 60% was green everywhere a human or an
    # agent looked, which ADR-0035 recorded as an open follow-up rather than an oversight. This is
    # that follow-up. It stays out of `verify --full` for the reason that ADR gives: coverage runs
    # both suites under the instrumenting runtime and costs about 80 s, against ~30 s for every
    # other gate put together, and a gate that doubles the loop is a gate people stop running.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/coverage.ts

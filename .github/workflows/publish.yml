name: Publish

# Publishing a GitHub release publishes the package to npm.
#
# There is no npm credential anywhere in this repository. npm mints a short-lived token from
# this workflow's OIDC identity (trusted publishing), which is why `id-token: write` is here
# and no secret is: the identity is the job, the tag it ran from, and this file's name — all
# three of which npm checks against the trusted publisher configured on the package. The same
# exchange produces the provenance attestation, so the registry can state which commit and
# which run built what it serves.
#
# The gate set is *not* re-listed here. `npm publish` runs `prepublishOnly` — build, the full
# verify, smoke:dist and the size budgets — which is the same enumeration problem corpus.yml
# already solved by refusing to have two definitions of "everything". A publish that skipped
# the gates would be one `--ignore-scripts` away, and it is not written here.
#
# Rehearsing: dispatch it manually with a tag and dry_run left on. That runs every step
# including `npm publish --dry-run`, and stops short of the write.
# A rehearsal also fails on a rejected OIDC identity, which `--dry-run` alone reports as a
# warning and a zero exit — so a green rehearsal means the tag would really publish.
# The dispatch must run from a ref the `npm-publish` environment admits — that is release tags
# only, so rehearse from a `v*` tag that contains this file. A release publish always satisfies
# this by construction: its event ref *is* the tag.
#
# A rehearsal only reaches the publish step for a version that is not on the registry yet,
# which is the state before every real release. Rehearsing a version that is already out
# stops at the no-op check, because `--dry-run` still asks the registry and the registry
# still refuses to hear about a version it already serves.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish or rehearse (e.g. v1.0.0)
        type: string
        required: true
      dry_run:
        description: Rehearse everything except the registry write
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The tags-only restriction lives here, declared by environment.yml — and is the whole
    # gate, since there is no required reviewer: a release publishes unattended. npm's trusted
    # publisher config names this environment too, so a job that is not this one cannot borrow
    # the identity.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@shbernal/ts-xlsx
    steps:
      - name: Resolve what is being published
        id: target
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG:-${INPUT_TAG}}"
          [ -n "${tag}" ] || { echo "::error::no tag to publish"; exit 1; }

          # A dispatch carries no release payload, so the tag's own shape decides: SemVer
          # spells a pre-release with a hyphen, and one must never take the `latest` dist-tag
          # out from under `npm install`.
          case "${RELEASE_PRERELEASE:-}" in
            true) prerelease=true ;;
            false) prerelease=false ;;
            *) case "${tag}" in *-*) prerelease=true ;; *) prerelease=false ;; esac ;;
          esac

          {
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
            echo "dry_run=${DRY_RUN:-false}"
          } >> "$GITHUB_OUTPUT"

          echo "tag=${tag} prerelease=${prerelease} dry_run=${DRY_RUN:-false}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag, never the branch the release was cut from: master moves on, and what
          # ships must be the commit the release names.
          ref: ${{ steps.target.outputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # `registry-url` is required, not optional, and not merely a default being restated: it
      # writes the .npmrc entry that tells npm which registry this publish authenticates
      # against, and without it npm never starts the OIDC exchange at all — it fails
      # ENEEDAUTH having asked nobody. The `NODE_AUTH_TOKEN` placeholder this also sets is
      # harmless, because publishing does not read it; that variable is for *installing*
      # private dependencies.
      #
      # No dependency cache: a release build should resolve everything from the lockfile
      # rather than from whatever a previous run left behind. Since v5 this action caches on
      # its own when package.json names a package manager, so omitting `cache` no longer
      # states that — `package-manager-cache: false` does. Today the automatic path only
      # fires for npm and this repo is on pnpm, which makes the line look redundant; it is
      # what keeps the property from depending on that coincidence.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; Node 24 does not yet ship one that new.
      # Pinned to the major that implements the OIDC exchange, not to `latest`, so a future
      # npm 12 cannot change how a release publishes without this line changing first.
      - name: Use an npm that can exchange an OIDC token
        run: |
          set -euo pipefail
          npm install -g npm@11
          npm --version

      - run: pnpm install --frozen-lockfile

      - name: The tag and the version must be the same claim
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail

          version=$(node -p "require('./package.json').version")
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${version}"
            echo "The release names a version the tagged commit does not declare. Fix the"
            echo "version in package.json and re-tag, rather than publishing the mismatch."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "${TAG} declares ${version}"
        id: version

      - name: Stop if this version is already on the registry
        id: existing
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          name=$(node -p "require('./package.json').name")
          # A version is immutable once published, so re-running this workflow — a re-published
          # release, a retried run — must be a no-op rather than a red X on a release that is
          # in fact fine.
          if npm view "${name}@${VERSION}" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${name}@${VERSION} is already published — nothing to do"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "${name}@${VERSION} is not on the registry yet"
          fi

      - name: Publish
        # Including for a dry run: `npm publish --dry-run` is not local. It builds the tarball
        # and then asks the registry, which refuses a version that already exists — so a
        # rehearsal of a published version would fail on a workflow that is perfectly correct.
        if: steps.existing.outputs.published == 'false'
        env:
          DRY_RUN: ${{ steps.target.outputs.dry_run }}
          PRERELEASE: ${{ steps.target.outputs.prerelease }}
          # setup-node's .npmrc points `_authToken` at this variable and defaults it to the
          # literal `XXXXX-XXXXX-XXXXX-XXXXX`. npm attempts the OIDC exchange either way, but
          # when that exchange fails it falls back to whatever token it holds — and publishing
          # with a placeholder gets a 404 from the registry, which reads as "no such package"
          # and hides the real cause. Emptied so a failed exchange fails as a failed exchange.
          NODE_AUTH_TOKEN: ''
        run: |
          set -euo pipefail

          args=""
          [ "${PRERELEASE}" = "true" ] && args="--tag next"
          [ "${DRY_RUN}" = "true" ] && args="${args} --dry-run"

          # Verbose because this is the one step whose failure mode is opaque: npm reports a
          # rejected identity as a 404, indistinguishable from a package that does not exist.
          # The verbose log names the trusted-publishing exchange, which is the difference —
          # and the next step reads this log to hold a rehearsal to the same standard.
          echo "npm publish ${args}"
          npm publish ${args} --loglevel verbose 2>&1 | tee "${RUNNER_TEMP}/npm-publish.log"

      # `npm publish --dry-run` demotes a rejected identity from an error to a warning and exits
      # 0. That is precisely backwards for a rehearsal: the one failure it exists to catch is the
      # one it reports as success, and that is not hypothetical — the rehearsal on 2026-07-30
      # went green while its exchange 404'd, so a misconfigured trusted publisher survived the
      # check and cost two version numbers before anyone read the log.
      #
      # A real publish needs no such guard: npm exits non-zero when it cannot authenticate.
      #
      # Two halves, because "no error" alone is not evidence. The exchange must have been
      # *attempted* — drop `registry-url` and npm asks nobody at all, which is how 1.0.1 failed
      # with ENEEDAUTH — and it must not have been *rejected*. Both markers are quoted from the
      # 2026-07-30 log; `npm http fetch` records 2xx as well as errors, so the attempt line is
      # present on success too.
      #
      # This reads the verbose log, so it depends on `--loglevel verbose` above. Remove that and
      # the first check fails rather than silently passing, which is the right direction.
      - name: A rehearsal must fail on a rejected identity
        if: steps.existing.outputs.published == 'false' && steps.target.outputs.dry_run == 'true'
        run: |
          set -euo pipefail

          log="${RUNNER_TEMP}/npm-publish.log"

          if ! grep -q 'oidc/token/exchange' "${log}"; then
            echo "::error::npm never attempted the OIDC token exchange"
            echo "The registry was never asked who this job is, so the rehearsal proved nothing"
            echo "about publishing. Check that setup-node still sets registry-url."
            exit 1
          fi

          if grep -qE 'Failed token exchange|This command requires you to be logged in' "${log}"; then
            echo "::error::npm's OIDC token exchange was rejected"
            echo "A real publish from this tag would fail. npm reports a rejected identity as a"
            echo "404, so read the trusted publisher on npmjs.com — its repository, workflow"
            echo "filename (publish.yml) and environment (npm-publish) must match this job."
            grep -E 'oidc|logged in' "${log}" >&2 || true
            exit 1
          fi

          echo "OIDC token exchange succeeded — this tag would publish for real"

      - name: Confirm the registry serves it
        if: steps.existing.outputs.published == 'false' && steps.target.outputs.dry_run != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          name=$(node -p "require('./package.json').name")
          for attempt in 1 2 3 4 5; do
            if npm view "${name}@${VERSION}" version > /dev/null 2>&1; then
              echo "${name}@${VERSION} is live"
              npm view "${name}@${VERSION}" dist.attestations || echo "::warning::no provenance attestation recorded"
              exit 0
            fi
            echo "not visible yet (attempt ${attempt}); the registry is eventually consistent"
            sleep 10
          done
          echo "::error::${name}@${VERSION} did not become visible after publishing"
          exit 1
